<!doctype html>
<html dir="ltr">
  <head>
    <meta charset="utf-8" />
    <style>
      @page {
        size: A4;
        margin: 18mm;
      }
      body {
        font:
          14px/1.5 Arial,
          sans-serif;
      }
      p {
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <p><b>1.</b> Study the laboratory values in the table and choose the most likely diagnosis?</p>
    <table border="1" cellpadding="4">
      <tr>
        <th>Test</th>
        <th>Value</th>
      </tr>
      <tr>
        <td>Hemoglobin</td>
        <td>7.1</td>
      </tr>
      <tr>
        <td>Platelets</td>
        <td>250</td>
      </tr>
    </table>
    <p style="margin-left: 0px">A. Anemia</p>
    <p style="margin-left: 0px">B. Polycythemia</p>
    <p style="margin-left: 0px">C. Leukemia</p>
    <p style="margin-left: 0px">D. Thrombocytosis</p>
    <p>Answer: A</p>
  </body>
</html>
