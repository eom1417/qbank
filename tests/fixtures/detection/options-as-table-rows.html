<!doctype html>
<html dir="ltr">

      @page {

      p {

  <body>
    <p><b>1.</b> Match the vitamin with its deficiency disease in the table below?</p>
    <table border="1" cellpadding="4">
      <tr>
        <td>A</td>
        <td>Vitamin C scurvy</td>
      </tr>
      <tr>
        <td>B</td>
        <td>Vitamin D rickets</td>
      </tr>
      <tr>
        <td>C</td>
        <td>Vitamin A night blindness</td>
      </tr>
      <tr>
        <td>D</td>
        <td>Vitamin K bleeding</td>
      </tr>
    </table>
    <p>Answer: B</p>
  </body>
