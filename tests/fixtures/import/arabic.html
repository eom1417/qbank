<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>نموذج أسئلة عربي (للاختبارات فقط)</title>
    <style>
      @page {
        size: A4;
        margin: 22mm 18mm;
      }
      body {
        font-family: 'Noto Naskh Arabic', serif;
        font-size: 13pt;
      }
      p {
        margin: 0 0 4pt;
      }
      .q {
        margin-top: 12pt;
      }
    </style>
  </head>
  <body>
    <div class="q">
      <p>س١) ما العضو المسؤول عن ضخ الدم؟</p>
      <p>أ) الرئة</p>
      <p>ب) القلب</p>
      <p>ج) الكبد</p>
      <p>د) الكلية</p>
    </div>
    <div class="q">
      <p>س٢) أي مما يلي من أعراض نقص السكر؟</p>
      <p>أ) التعرّق</p>
      <p>ب) العطش</p>
      <p>ج) كثرة التبول</p>
    </div>
    <div class="q"><p>س٣) اشرح علاج الحماض الكيتوني السكري عند الأطفال.</p></div>
  </body>
</html>
