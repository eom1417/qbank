<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pipeline questions (synthetic test fixture only)</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      body {
        margin: 0;
        font-family: 'Liberation Serif', serif;
        font-size: 12pt;
      }
      .page {
        position: relative;
        width: 210mm;
        height: 296mm;
        overflow: hidden;
        break-after: page;
      }
      .page:last-child {
        break-after: auto;
      }
      .body {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 80px;
      }
      p {
        margin: 0 0 6pt;
      }
      .q {
        margin-top: 22pt;
      }
      .gap {
        margin-top: 18pt;
      }
      img {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="body">
        <p class="q">Q1) A made-up child has a cough. Which test comes first?</p>
        <p>A. Chest film</p>
        <p>B. Blood count</p>
        <p>C. Throat swab</p>
        <p class="gap">Part II 2019</p>
        <p class="gap">Correct answer: B</p>
        <img src="{{chart}}" style="width: 220px; margin-top: 18pt" />
        <svg width="200" height="60" style="position: absolute; left: 400px; top: 170px">
          <path
            d="M5 40 C 30 5, 50 55, 75 25 S 120 10, 140 40 S 170 50, 190 20"
            stroke="#d01818"
            stroke-width="4"
            fill="none"
          />
        </svg>
        <p class="q" style="margin-top: 40pt">
          Q2) The X-ray shown below is of a made-up patient. What does it show?
        </p>
        <p>A. Nothing unusual</p>
        <p>B. A broken rib</p>
        <img src="{{film}}" style="width: 200px; margin-top: 4pt" />
      </div>
    </div>
    <div class="page">
      <div class="body"></div>
    </div>
    <div class="page">
      <div class="body"><img src="{{typed}}" style="width: 520px" /></div>
    </div>
  </body>
</html>
