<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">QBank Engine</title>
  <desc id="desc">Turn your books and question PDFs into a private, AI-checked question bank you host yourself.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#0b3b44"/>
      <stop offset="1" stop-color="#0b6e75"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>

  <g transform="translate(96 84) scale(0.375)">
    <rect width="512" height="512" rx="112" fill="#0b6e75" stroke="#5eead4" stroke-opacity="0.45" stroke-width="6"/>
    <circle cx="246" cy="236" r="118" fill="none" stroke="#ffffff" stroke-width="44"/>
    <path d="M300 300 L392 392" stroke="#ffffff" stroke-width="48" stroke-linecap="round"/>
    <path d="M196 238 l38 38 l72 -82" fill="none" stroke="#7dd5d9" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="320" y="150" font-size="68" font-weight="800" letter-spacing="-1.5">QBank Engine</text>
    <text x="322" y="200" font-size="26" font-weight="500" fill="#ccfbf1">Your books in. A private question bank out.</text>
    <text x="322" y="240" font-size="20" fill="#99f6e4" fill-opacity="0.85">Import · Study · Share exams · Bring your own AI · Self-hosted</text>
  </g>

  <g font-family="'Noto Sans Arabic', 'IBM Plex Sans Arabic', Tahoma, sans-serif" fill="#ffffff" fill-opacity="0.9" text-anchor="end">
    <text x="1184" y="70" font-size="20" font-weight="600">كتبك تتحوّل إلى بنك أسئلة خاص بك، على خادمك أنت</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="322" y="276" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="370" y="297" text-anchor="middle" fill="#ccfbf1">MIT</text>
    <rect x="430" y="276" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="500" y="297" text-anchor="middle" fill="#ccfbf1">Arabic · English</text>
    <rect x="582" y="276" width="120" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="642" y="297" text-anchor="middle" fill="#ccfbf1">Docker ready</text>
  </g>
</svg>
