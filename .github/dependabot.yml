# Keeps pinned action SHAs current. Bootstrap adds the project's package ecosystems
# (npm, pip, gomod, ...) with the same commit-message prefix (Conventional Commits).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /.genesis/tools
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
