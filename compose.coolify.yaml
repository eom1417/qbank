# QBank on Coolify (accounts mode, DEC-35): compose.server.yaml without Caddy. Coolify's Traefik
# takes HTTPS: give the qbank service its domain with port 3000 (https://your.domain:3000).
# Coolify generates SERVICE_PASSWORD_POSTGRES itself and keeps it as a secret; set QBANK_DOMAIN
# (the bare host, e.g. qbank.example.com) and, optionally, the operator and Google lines below.
# Limits suit a 12 GB, 4 vCPU server. Setup, backups and restore: docs/SELF-HOST-COOLIFY.md.

x-pg-client: &pg-client
  PGHOST: db
  PGUSER: qbank
  PGDATABASE: qbank
  PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qbank
      POSTGRES_DB: qbank
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - qbank-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qbank -d qbank']
      interval: 5s
      retries: 20
    mem_limit: 1536m
    cpus: 1
    restart: unless-stopped

  qbank:
    build: .
    command: ['node', 'scripts/qbank-server.mjs']
    environment:
      DATABASE_URL: postgres://qbank:${SERVICE_PASSWORD_POSTGRES}@db:5432/qbank
      QBANK_API_HOST: 0.0.0.0
      # Only Traefik reaches this container; it sets the forwarded host and address.
      QBANK_TRUST_PROXY: 'true'
      QBANK_ALLOWED_ORIGINS: https://${QBANK_DOMAIN:?set QBANK_DOMAIN}
      # Blank means unset (no operator, no Google sign-in, no uptime ping): see config/index.ts.
      QBANK_OPERATOR_EMAIL: ${QBANK_OPERATOR_EMAIL:-}
      QBANK_OPERATOR_NAME: ${QBANK_OPERATOR_NAME:-}
      QBANK_GOOGLE_CLIENT_ID: ${QBANK_GOOGLE_CLIENT_ID:-}
      QBANK_GOOGLE_CLIENT_SECRET: ${QBANK_GOOGLE_CLIENT_SECRET:-}
      QBANK_HEARTBEAT_URL: ${QBANK_HEARTBEAT_URL:-}
      QBANK_IMPORT_WORKERS: ${QBANK_IMPORT_WORKERS:-2}
      QBANK_AI_HOSTS_MAX: ${QBANK_AI_HOSTS_MAX:-4}
      QBANK_BACKUP_STATUS_FILE: /backups/status.json
    volumes:
      - qbank-data:/data
      - qbank-backups:/backups:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 6g
    cpus: 2.5
    restart: unless-stopped

  # Daily backups (M32): database and data volume into qbank-backups, 7 days and 4 Sundays kept.
  backup:
    build:
      context: .
      dockerfile: deploy/backup.Dockerfile
    command: ['sh', '/scripts/server-backup.sh']
    environment: *pg-client
    volumes:
      - qbank-data:/data:ro
      - qbank-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  qbank-db:
  qbank-data:
  qbank-backups:
